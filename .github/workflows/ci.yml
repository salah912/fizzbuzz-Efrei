name: Run Tests and Build Docker Image

on:
  push:
    branches:
      - main
      - docker
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.12-alpine  # Utilise une image Docker avec Python pour les tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          apk add --no-cache gcc musl-dev libffi-dev openssl-dev python3-dev make
          pip install --no-cache-dir -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests --cov=fizzbuzz --cov-report=xml --cov-report=term --cov-report=html

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/  # Assure-toi que htmlcov/ est généré

  pr-validation:
    needs: test  # Cette étape dépend du succès des tests
    if: github.event_name == 'pull_request' && success()
    runs-on: ubuntu-latest

    steps:
      - name: Validate_PR
        run: echo "✅ Tests passed! PR can be merged."
